substitutions:
  _APP_NAME: 'test-application-cicd-027' # Incremented version
  _SPACE_NAME: 'default-space'
  _LOCATION: 'us-central1'
  _DEPLOY_SA_EMAIL: 'testappli-us-c1@test-prj-492905.iam.gserviceaccount.com'
  _TEMPLATE_NAME: 'app-template-1'

steps:
# 1. Create, Preview, and Deploy Application from Templates.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  timeout: 1800s # Increased timeout to accommodate polling
  args:
    - -c
    - |
      echo "Fetching latest revision for template ${_TEMPLATE_NAME}..."
      LATEST_REVISION_URI=$$(gcloud design-center spaces application-templates describe ${_TEMPLATE_NAME} --space=${_SPACE_NAME} --project=$PROJECT_ID --location=${_LOCATION} --format="value(latestRevision)")
      if [ -z "$$LATEST_REVISION_URI" ]; then
        echo "Failed to get latest revision URI for template ${_TEMPLATE_NAME}"
        exit 1
      fi
      echo "Latest Revision URI: $$LATEST_REVISION_URI"

      LATEST_REVISION=$$(basename $$LATEST_REVISION_URI)
      if [ -z "$$LATEST_REVISION" ]; then
        echo "Failed to extract revision ID from URI: $$LATEST_REVISION_URI"
        exit 1
      fi
      echo "Latest Revision ID: $$LATEST_REVISION"

      TEMPLATE_REVISION_URI="projects/$PROJECT_ID/locations/${_LOCATION}/spaces/${_SPACE_NAME}/applicationTemplates/${_TEMPLATE_NAME}/revisions/$$LATEST_REVISION"

      echo "Creating application ${_APP_NAME} from template revision: $$TEMPLATE_REVISION_URI..."
      gcloud design-center spaces applications create ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --source-application-template-revision="$$TEMPLATE_REVISION_URI" \
        --scope-type=global

      if [ $$? -ne 0 ]; then
        echo "Failed to create application ${_APP_NAME}"
        exit 1
      fi
      echo "Application ${_APP_NAME} created."

      SERVICE_ACCOUNT_NAME="projects/$PROJECT_ID/serviceAccounts/${_DEPLOY_SA_EMAIL}"
      echo "Starting Preview for application ${_APP_NAME} using SA $$SERVICE_ACCOUNT_NAME..."
      # Capture the full output of the preview command
      gcloud design-center spaces applications preview ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" > preview_output.txt 2>&1

      cat preview_output.txt

      if [ $$? -ne 0 ]; then
        echo "Failed to start preview for application ${_APP_NAME}"
        exit 1
      fi

      # Attempt to extract the operation name - THIS IS A GUESS, ADJUST BASED ON OUTPUT
      PREVIEW_LRO=$$(cat preview_output.txt | grep 'operations/' | sed 's/.*"\(projects\/.*\/operations\/[^"]*\)".*/\1/' | head -n 1)

      if [ -z "$$PREVIEW_LRO" ]; then
        echo "ERROR: Could not extract operation name from preview output."
        exit 1
      fi
      echo "Preview operation name: $$PREVIEW_LRO"

      echo "Waiting for Preview operation to complete..."
      COUNTER=0
      MAX_RETRIES=60
      SLEEP_DURATION=10
      while [ $$COUNTER -lt $$MAX_RETRIES ]; do
        OPERATION_OUTPUT=$$(gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID 2>&1)
        GCLOUD_EXIT_CODE=$$?

        if [ $$GCLOUD_EXIT_CODE -ne 0 ]; then
          echo "Error describing operation: $$OPERATION_OUTPUT"
          echo "Retrying in $$SLEEP_DURATION seconds..."
          sleep $$SLEEP_DURATION
          COUNTER=$$(expr $$COUNTER + 1)
          continue
        fi

        PREVIEW_STATUS=$$(echo "$$OPERATION_OUTPUT" | grep -o '"done": [^,]*' | cut -d' ' -f2)
        if [ "$$PREVIEW_STATUS" = "true" ]; then
          echo "Preview operation $$PREVIEW_LRO finished."
          break
        fi
        echo "Preview not done yet, waiting $$SLEEP_DURATION seconds... (Attempt: $$COUNTER/$$MAX_RETRIES)"
        sleep $$SLEEP_DURATION
        COUNTER=$$(expr $$COUNTER + 1)
      done

      if [ "$$PREVIEW_STATUS" != "true" ]; then
        echo "ERROR: Preview operation timed out."
        gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID
        exit 1
      fi

      # Check for errors in the completed operation
      PREVIEW_ERROR=$$(gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID --format="value(error.message)")
      if [ -n "$$PREVIEW_ERROR" ]; then
        echo "ERROR: Preview operation $$PREVIEW_LRO failed: $$PREVIEW_ERROR"
        gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID
        exit 1
      fi
      echo "Preview operation successful."

      echo "Deploying application ${_APP_NAME} using SA $$SERVICE_ACCOUNT_NAME..."
      gcloud design-center spaces applications deploy ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" \
        --async

      if [ $$? -ne 0 ]; then
        echo "Failed to deploy application ${_APP_NAME}"
        exit 1
      fi
      echo "Deployment started for application ${_APP_NAME}."

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
