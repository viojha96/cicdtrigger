substitutions:
  _APP_NAME: 'test-application-cicd-032' # Incremented version
  _SPACE_NAME: 'default-space'
  _LOCATION: 'us-central1'
  _DEPLOY_SA_EMAIL: 'testappli-us-c1@test-prj-492905.iam.gserviceaccount.com'
  _TEMPLATE_NAME: 'app-template-4'

steps:
# 1. Create, Preview, and Deploy Application from Templates.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  timeout: 1800s # Increased timeout to accommodate polling
  args:
    - -c
    - |
      # ... (application creation steps as before) ...
      echo "Application ${_APP_NAME} created."

      SERVICE_ACCOUNT_NAME="projects/$PROJECT_ID/serviceAccounts/${_DEPLOY_SA_EMAIL}"

      echo "Starting Preview for application ${_APP_NAME} using SA $$SERVICE_ACCOUNT_NAME..."
      PREVIEW_STDERR=$$(gcloud design-center spaces applications preview ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" 2>&1 > /dev/null)

      echo "Preview command stderr:"
      echo "$$PREVIEW_STDERR"

      if [ $$? -ne 0 ]; then
        echo "Failed to start preview for application ${_APP_NAME}"
        exit 1
      fi

      PREVIEW_LRO=$$(echo "$$PREVIEW_STDERR" | grep -o 'projects/[^ ]*' | head -n 1 | sed 's/]$$//')

      if [ -z "$$PREVIEW_LRO" ]; then
        echo "ERROR: Could not extract operation name from preview stderr."
        exit 1
      fi
      echo "Preview operation name: $$PREVIEW_LRO"

      echo "Waiting for Preview operation to complete..."
      COUNTER=0
      MAX_RETRIES=60
      SLEEP_DURATION=15
      IS_DONE="false" # Initialize IS_DONE

      while [ $$COUNTER -lt $$MAX_RETRIES ]; do
        OPERATION_OUTPUT=$$(gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID --format=json 2>&1)
        GCLOUD_EXIT_CODE=$$?

        if [ $$GCLOUD_EXIT_CODE -ne 0 ]; then
          echo "Error describing operation (Attempt: $$COUNTER/$$MAX_RETRIES): $$OPERATION_OUTPUT"
          sleep $$SLEEP_DURATION
          COUNTER=$$(expr $$COUNTER + 1)
          continue
        fi

        echo "--- Operation Status (Attempt $$COUNTER) ---"
        echo "$$OPERATION_OUTPUT"
        echo "---------------------------------------"

        # More robust check for done: true
        if echo "$$OPERATION_OUTPUT" | grep -q '"done": true'; then
          echo "Preview operation $$PREVIEW_LRO finished."
          IS_DONE="true"
          break
        fi

        echo "Preview not done yet, waiting $$SLEEP_DURATION seconds... (Attempt: $$COUNTER/$$MAX_RETRIES)"
        sleep $$SLEEP_DURATION
        COUNTER=$$(expr $$COUNTER + 1)
      done

      if [ "$$IS_DONE" != "true" ]; then
        echo "ERROR: Preview operation timed out."
        # Print the last known status
        gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID
        exit 1
      fi

      # Check for errors in the completed operation
      PREVIEW_ERROR=$$(gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID --format="value(error.message)")
      if [ -n "$$PREVIEW_ERROR" ]; then
        echo "ERROR: Preview operation $$PREVIEW_LRO failed: $$PREVIEW_ERROR"
        gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID
        exit 1
      fi
      echo "Preview operation successful."

      echo "Deploying application ${_APP_NAME} using SA $$SERVICE_ACCOUNT_NAME..."
      gcloud design-center spaces applications deploy ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" \
        --async

      if [ $$? -ne 0 ]; then
        echo "Failed to deploy application ${_APP_NAME}"
        exit 1
      fi
      echo "Deployment started for application ${_APP_NAME}."

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
