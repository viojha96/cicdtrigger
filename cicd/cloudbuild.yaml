substitutions:
  _APP_NAME: 'test-application-cicd-022'
  _SPACE_NAME: 'default-space'
  _LOCATION: 'us-central1'
  _DEPLOY_SA_EMAIL: 'testappli-us-c1@test-prj-492905.iam.gserviceaccount.com'
  _TEMPLATE_NAME: 'tt-tmpl-demo'

steps:
# 1. Create and Deploy Application from Templates.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
    - -c
    - |
      echo "Fetching latest revision for template ${_TEMPLATE_NAME} in Project ${PROJECT_ID}..."
      # LATEST_REVISION_URI=$(gcloud alpha design-center spaces application-templates describe ${_TEMPLATE_NAME} --space=${_SPACE_NAME} --project=$PROJECT_ID --location=${_LOCATION} --format="value(latestRevision)")
      # if [ -z "$$LATEST_REVISION_URI" ]; then
      #   echo "Failed to get latest revision URI for template ${_TEMPLATE_NAME}"
      #   exit 1
      # fi
      # echo "Latest Revision URI: $$LATEST_REVISION_URI"

      # # Extract the revision ID from the full URI
      # LATEST_REVISION=$(basename $$LATEST_REVISION_URI)
      # if [ -z "$$LATEST_REVISION" ]; then
      #   echo "Failed to extract revision ID from URI: $$LATEST_REVISION_URI"
      #   exit 1
      # fi
      # echo "Latest Revision ID: $$LATEST_REVISION"
            # Attempt to get the latest revision URI, capturing stderr
      GCLOUD_OUTPUT=$(gcloud alpha design-center spaces application-templates describe ${_TEMPLATE_NAME} --space=${_SPACE_NAME} --project=$PROJECT_ID --location=${_LOCATION} --format="value(latestRevision)" 2>&1)
      echo "gcloud output (stdout & stderr): $GCLOUD_OUTPUT"
      LATEST_REVISION_URI=$(echo "$GCLOUD_OUTPUT")

      if [ -z "$LATEST_REVISION_URI" ]; then
        echo "Failed to get latest revision URI for template ${_TEMPLATE_NAME}. Output was empty."
        exit 1
      fi
      echo "Latest Revision URI: $LATEST_REVISION_URI"

      # Construct the full URI for the source application template revision
      TEMPLATE_REVISION_URI="projects/$PROJECT_ID/locations/${_LOCATION}/spaces/${_SPACE_NAME}/applicationTemplates/${_TEMPLATE_NAME}/revisions/$$LATEST_REVISION"

      echo "Creating application ${_APP_NAME} from template revision: $$TEMPLATE_REVISION_URI..."
      gcloud alpha design-center spaces applications create ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --source-application-template-revision="$$TEMPLATE_REVISION_URI" \
        --scope-type=global

      # Check if the create command was successful
      if [ $$? -ne 0 ]; then
        echo "Failed to create application ${_APP_NAME}"
        exit 1
      fi

      echo "Deploying application ${_APP_NAME}..."
      SERVICE_ACCOUNT_NAME="projects/$PROJECT_ID/serviceAccounts/${_DEPLOY_SA_EMAIL}"
      gcloud alpha design-center spaces applications deploy ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" \
        --async

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
