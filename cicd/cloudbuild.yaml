substitutions:
  _APP_NAME: 'test-application-cicd-041' # Incremented version
  _SPACE_NAME: 'default-space'
  _LOCATION: 'us-central1'
  _DEPLOY_SA_EMAIL: 'testappli-us-c1@test-prj-492905.iam.gserviceaccount.com'
  _TEMPLATE_NAME: 'app-template-4'
  TAG_NAME: 'latest'
  _IMAGE_NAME: 'gcr.io/${PROJECT_ID}/adc-cicd/adc-cr-demo:${TAG_NAME}'
  _FE_SERVICE_NAME: 'tt-fe-svc-1'

steps:
# 1. Build the new container image.
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', '${_IMAGE_NAME}', '--build-arg', 'IMAGE_TAG=${TAG_NAME}', '-f', 'cicd/Dockerfile', './cicd']
  id: 'BuildImage'

# 2. Create Application, Update Image, Preview, and Deploy.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  timeout: 1800s
  id: 'CreateUpdatePreviewDeploy'
  args:
    - -c
    - |
      echo "Updating apt-get and installing jq..."
      apt-get update && apt-get install -y jq curl

      echo "Fetching latest revision for template ${_TEMPLATE_NAME}..."
      LATEST_REVISION_URI=$$(gcloud design-center spaces application-templates describe ${_TEMPLATE_NAME} --space=${_SPACE_NAME} --project=$PROJECT_ID --location=${_LOCATION} --format="value(latestRevision)")
      if [ -z "$$LATEST_REVISION_URI" ]; then
        echo "Failed to get latest revision URI for template ${_TEMPLATE_NAME}"
        exit 1
      fi

      LATEST_REVISION=$$(basename $$LATEST_REVISION_URI)
      if [ -z "$$LATEST_REVISION" ]; then
        echo "Failed to extract revision ID from URI: $$LATEST_REVISION_URI"
        exit 1
      fi

      TEMPLATE_REVISION_URI="projects/$PROJECT_ID/locations/${_LOCATION}/spaces/${_SPACE_NAME}/applicationTemplates/${_TEMPLATE_NAME}/revisions/$$LATEST_REVISION"

      echo "Creating application ${_APP_NAME} from template revision: $$TEMPLATE_REVISION_URI..."
      gcloud design-center spaces applications create ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --source-application-template-revision="$$TEMPLATE_REVISION_URI" \
        --scope-type=global > /dev/null

      if [ $$? -ne 0 ]; then
        echo "Failed to create application ${_APP_NAME}"
        exit 1
      fi
      echo "Application ${_APP_NAME} create command issued."

      APP_URL="https://designcenter.googleapis.com/v1alpha/projects/${PROJECT_ID}/locations/${_LOCATION}/spaces/${_SPACE_NAME}/applications/${_APP_NAME}"
      SERVICE_ACCOUNT_NAME="projects/$PROJECT_ID/serviceAccounts/${_DEPLOY_SA_EMAIL}"

      echo "Fetching latest app config from $$APP_URL?\$fields=componentParameters"
      curl -X GET -H "Content-Type: application/json" -H "Authorization: Bearer $$(gcloud auth print-access-token)" "$$APP_URL?\$fields=componentParameters" -o component_parameters.json

      if [ $$? -ne 0 ]; then
          echo "ERROR: Failed to fetch app config"
          exit 1
      fi

      echo "Updating container image for service ${_FE_SERVICE_NAME} to ${_IMAGE_NAME}"
      jq '(.componentParameters[] | select(.parameters[] | select(.key == "service_name").value == "${_FE_SERVICE_NAME}") | .parameters[] | select(.key == "containers") | .value[0].container_image) = "${_IMAGE_NAME}"' component_parameters.json > temp.json && mv temp.json component_parameters.json

      if [ $$? -ne 0 ]; then
          echo "ERROR: Failed to update image in JSON"
          exit 1
      fi

      echo "Patching application componentParameters..."
      curl -X PATCH -H "Content-Type: application/json" -H "Authorization: Bearer $$(gcloud auth print-access-token)" -d "@component_parameters.json" "$$APP_URL?update_mask=componentParameters"

      if [ $$? -ne 0 ]; then
          echo "ERROR: Failed to PATCH application"
          exit 1
      fi
      echo "Application ${_APP_NAME} updated with new image."
      rm -f component_parameters.json

      echo "Starting Preview for application ${_APP_NAME} using SA $$SERVICE_ACCOUNT_NAME..."
      PREVIEW_STDERR=$$(gcloud design-center spaces applications preview ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" 2>&1 > /dev/null)

      if echo "$$PREVIEW_STDERR" | grep -q "ERROR"; then
         echo "ERROR: Preview command failed. Exiting."
         echo "$$PREVIEW_STDERR"
         exit 1
      fi

      PREVIEW_LRO=$$(echo "$$PREVIEW_STDERR" | grep -o 'projects/[^ ]*operations/[^ ]*' | head -n 1 | sed 's/]$$//')

      if [ -z "$$PREVIEW_LRO" ]; then
        echo "ERROR: Could not extract operation name from preview stderr."
        echo "Stderr: $$PREVIEW_STDERR"
        exit 1
      fi

      echo "Waiting for Preview operation to complete..."
      COUNTER=0
      MAX_RETRIES=60
      SLEEP_DURATION=15
      IS_DONE="false"

      while [ $$COUNTER -lt $$MAX_RETRIES ]; do
        OPERATION_OUTPUT=$$(gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID --format=json 2>&1)
        GCLOUD_EXIT_CODE=$$?
        if [ $$GCLOUD_EXIT_CODE -ne 0 ]; then
          sleep $$SLEEP_DURATION
          COUNTER=$$(expr $$COUNTER + 1)
          continue
        fi
        if echo "$$OPERATION_OUTPUT" | grep -q '"done": true'; then
          IS_DONE="true"
          break
        fi
        sleep $$SLEEP_DURATION
        COUNTER=$$(expr $$COUNTER + 1)
      done

      if [ "$$IS_DONE" != "true" ]; then
        echo "ERROR: Preview operation timed out."
        exit 1
      fi

      echo "--- Final Preview Operation Response ---"
      LATEST_OPERATION_OUTPUT=$$(gcloud design-center operations describe $$PREVIEW_LRO --location=${_LOCATION} --project=$PROJECT_ID --format=json)
      echo "$$LATEST_OPERATION_OUTPUT"
      echo "----------------------------------------"

      PREVIEW_ERROR=$$(echo "$$LATEST_OPERATION_OUTPUT" | grep '"code":' | head -n 1)
      if [ -n "$$PREVIEW_ERROR" ]; then
        echo "ERROR: Preview operation $$PREVIEW_LRO failed."
        exit 1
      fi
      echo "Preview operation successful."

      echo "Deploying application ${_APP_NAME} using SA $$SERVICE_ACCOUNT_NAME..."
      DEPLOY_STDERR=$$(gcloud design-center spaces applications deploy ${_APP_NAME} \
        --space=${_SPACE_NAME} \
        --project=$PROJECT_ID \
        --location=${_LOCATION} \
        --service-account="$$SERVICE_ACCOUNT_NAME" \
        --async 2>&1 > /dev/null)

      if [ $$? -ne 0 ]; then
        echo "Failed to start deployment for application ${_APP_NAME}"
        echo "$$DEPLOY_STDERR"
        exit 1
      fi
      echo "Deployment started for application ${_APP_NAME}."
      echo "$$DEPLOY_STDERR"

images: ['${_IMAGE_NAME}']

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
